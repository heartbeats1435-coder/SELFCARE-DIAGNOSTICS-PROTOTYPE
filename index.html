<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0eb885">
  <meta name="description" content="Selfcare Diagnostics - Empowering Wellness through accurate diagnostic testing, fast reports, and doorstep sample collections.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Selfcare">

  <title>Selfcare Diagnostics | Empowering Wellness</title>

  <!-- Favicon & Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #093729 0%, #0eb885 50%, #09281e 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      overflow: hidden;
    }

    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .bg-blur-1 {
      position: absolute;
      width: 320px;
      height: 320px;
      background: rgba(14, 184, 133, 0.35);
      filter: blur(90px);
      border-radius: 50%;
      top: 10%;
      left: -10%;
      z-index: 1;
    }

    .bg-blur-2 {
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(12, 163, 118, 0.25);
      filter: blur(80px);
      bottom: 15%;
      right: -10%;
      z-index: 1;
    }

    .logo-wrapper {
      width: 100%;
      max-width: 280px;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.25));
      }
    }

    .logo-image {
      max-width: 260px;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: 0 auto;
    }

    .loader-pulse {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .loader-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loader-dot:nth-child(1) { animation-delay: -0.32s; }
    .loader-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .status-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 14px;
      font-weight: 500;
      min-height: 20px;
      letter-spacing: 0.02em;
    }

    .splash-footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="bg-blur-1"></div>
  <div class="bg-blur-2"></div>

  <main class="splash-container">
    <div class="logo-wrapper">
      <img
        class="logo-image"
        src="assets/images/logo.png"
        alt="Selfcare Diagnostics - Empowering Wellness"
      >
    </div>

    <div class="loader-pulse">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
    <div class="status-text" id="status-text">Verifying secure session...</div>
  </main>

  <footer class="splash-footer">
    &copy; 2026 SELFCARE DIAGNOSTICS. All rights reserved.
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (async function verifyAndRoute() {
      const statusText = document.getElementById('status-text');

      const sessionRaw = localStorage.getItem(window.SelfcareConfig.STORAGE_SESSION_KEY) || 
                         sessionStorage.getItem(window.SelfcareConfig.STORAGE_SESSION_KEY);

      if (!sessionRaw) {
        statusText.textContent = 'Redirecting to login...';
        setTimeout(() => window.location.replace('login.html'), 500);
        return;
      }

      try {
        const session = JSON.parse(sessionRaw);
        const now = Date.now();

        if (!session.token || !session.expiresAt || session.expiresAt <= now) {
          throw new Error('Local session token expired');
        }

        statusText.textContent = 'Validating authentication with server...';
        const serverCheck = await window.SelfcareAPI.checkSession(session.token);

        if (serverCheck && serverCheck.valid && serverCheck.role === 'customer') {
          statusText.textContent = 'Session active. Opening dashboard...';
          setTimeout(() => window.location.replace('customer.html'), 400);
        } else {
          throw new Error('Server rejected session token');
        }

      } catch (err) {
        console.warn('Session verification failed, routing to login:', err);
        localStorage.removeItem(window.SelfcareConfig.STORAGE_SESSION_KEY);
        sessionStorage.removeItem(window.SelfcareConfig.STORAGE_SESSION_KEY);
        statusText.textContent = 'Session ended. Redirecting to login...';
        setTimeout(() => window.location.replace('login.html'), 600);
      }
    })();
  </script>
</body>
</html>
